<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Obserwator</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Pico CSS (minimal CSS framework) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

    <!-- Nogat's app menu (DEV-15.4), a byte-for-byte copy of Nogat design/kit/ -->
    <link rel="stylesheet" href="/static/nogat/nogat-app-menu.css">
    <script type="module" src="/static/nogat/nogat-app-menu.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="container-fluid">
        <ul>
            <li><a href="/" class="contrast"><strong>Obserwator</strong></a></li>
        </ul>
        <ul>
            <li><a href="/download">Pobieranie</a></li>
            <li><a href="/stations">Stacje</a></li>
            <li><a href="/map">Mapa</a></li>
            <li><a href="/docs" target="_blank">API</a></li>
            <li><nogat-app-menu current="obserwator" marks="/static/nogat/marks/"{% if gui_json %} apps="{{ gui_json }}"{% endif %}></nogat-app-menu></li>
        </ul>
    </nav>

    <!-- Main content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer: the provider lines of the view's data (Nogat DEV §20), none without data -->
    <footer class="container">
        <hr>
        {% include "partials/provider_lines.html" %}
        <p>
            <small>
                Obserwator v{{ version }} |
                <a href="https://github.com/Daldek/Obserwator" target="_blank">GitHub</a>
            </small>
        </p>
    </footer>

    <!-- HTMX loading indicator -->
    <div id="loading-indicator" class="htmx-indicator">
        <div aria-busy="true">Ładowanie...</div>
    </div>

    <!-- Custom scripts -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
